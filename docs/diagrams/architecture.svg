<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-labelledby="t d">
  <title id="t">Drone × AI inspection architecture</title>
  <desc id="d">One inspection loop from upload to report, with human authority, persistent state, and future geometry and drone modules.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B1B1B"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A8792"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A63A4A"/>
    </marker>
  </defs>
  <rect width="1080" height="720" fill="#FBFBF8"/>
  <text x="40" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#1B1B1B">Drone × AI Inspection — System Architecture</text>
  <text x="40" y="60" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-style="italic" fill="#5F6B75">One real inspection loop; demo tabs are isolated surfaces that never write to the report.</text>

  <!-- Capture -->
  <rect x="38" y="92" width="226" height="316" rx="8" fill="#F4F7FA" stroke="#D5DEE7"/>
  <text x="52" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#5F6B75">CAPTURE &amp; INGEST</text>
  <rect x="54" y="128" width="194" height="58" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="66" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Upload API</text>
  <text x="66" y="168" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">JPEG / PNG / WebP · 40 MB</text>
  <rect x="54" y="198" width="194" height="72" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="66" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Media store</text>
  <text x="66" y="238" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">original · full · preview · thumb</text>
  <text x="66" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">sha256 provenance</text>
  <rect x="54" y="282" width="194" height="72" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="66" y="304" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Asset registry</text>
  <text x="66" y="322" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">structure · member · km · rights</text>
  <text x="66" y="338" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">B-14 / T-07 / earthworks</text>
  <text x="54" y="382" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">CSV import · manual correction</text>

  <!-- Inference -->
  <rect x="292" y="92" width="244" height="316" rx="8" fill="#F4F7FA" stroke="#D5DEE7"/>
  <text x="306" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#5F6B75">INFERENCE</text>
  <rect x="308" y="128" width="212" height="58" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="320" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Job runner</text>
  <text x="320" y="168" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">queued → running → done / failed</text>
  <rect x="308" y="198" width="212" height="88" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="320" y="220" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Grounding DINO tiny</text>
  <text x="320" y="238" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">zero-shot · 5 classes · CPU</text>
  <text x="320" y="254" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">2×2 crack tiles if &gt; 3000 px</text>
  <text x="320" y="270" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">NMS across classes</text>
  <rect x="308" y="298" width="212" height="56" rx="6" fill="#FFFFFF" stroke="#24425F" stroke-dasharray="5 4"/>
  <text x="320" y="320" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1B1B1B">Geometry / drone modules</text>
  <text x="320" y="338" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">future: rail mesh · point cloud</text>
  <text x="308" y="386" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">model hash + threshold logged</text>

  <!-- Review with human authority -->
  <rect x="572" y="92" width="286" height="316" rx="8" fill="#FCF2F3" stroke="#A63A4A" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="586" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#A63A4A">HUMAN AUTHORITY</text>
  <rect x="586" y="128" width="258" height="70" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="598" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Candidate review</text>
  <text x="598" y="168" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">overlay · evidence · provenance</text>
  <text x="598" y="184" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">unconfirmed / confirmed / reshoot</text>
  <rect x="586" y="212" width="258" height="64" rx="6" fill="#E8F3EA" stroke="#2F6240"/>
  <text x="598" y="234" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1B1B1B">Engineer judgement</text>
  <text x="598" y="252" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">AA / A1 / A2 / B / C / S + comment</text>
  <text x="598" y="268" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#5F6B75">append-only event</text>
  <rect x="586" y="290" width="258" height="86" rx="6" fill="#FFFFFF" stroke="#24425F" stroke-dasharray="5 4"/>
  <text x="598" y="312" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1B1B1B">Measurement (β)</text>
  <text x="598" y="330" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">model points: horizontal / Δh / slope</text>
  <text x="598" y="346" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">survey grade only with GCP + cloud</text>
  <text x="586" y="394" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#A63A4A">AI proposes; a human decides. No auto-confirm.</text>

  <!-- Report -->
  <rect x="890" y="92" width="152" height="316" rx="8" fill="#F4F7FA" stroke="#D5DEE7"/>
  <text x="904" y="114" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#5F6B75">REPORT</text>
  <rect x="904" y="128" width="124" height="84" rx="6" fill="#EAF2FA" stroke="#24425F"/>
  <text x="916" y="150" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1B1B1B">DOCX</text>
  <text x="916" y="168" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">confirmed only</text>
  <text x="916" y="184" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">license gate</text>
  <text x="916" y="200" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">pending count</text>
  <rect x="904" y="226" width="124" height="64" rx="6" fill="#FFFFFF" stroke="#6B5A3E" stroke-dasharray="5 4"/>
  <text x="916" y="248" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1B1B1B">Audit CSV</text>
  <text x="916" y="266" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">append-only log</text>

  <!-- Flows -->
  <line x1="248" y1="157" x2="308" y2="157" stroke="#1B1B1B" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="520" y1="157" x2="586" y2="157" stroke="#7A8792" stroke-width="1.6" marker-end="url(#g)"/>
  <line x1="844" y1="244" x2="904" y2="170" stroke="#1B1B1B" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="714" y1="392" x2="714" y2="430" stroke="#A63A4A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="724" y="416" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#A63A4A">judgement event</text>

  <!-- Persistent state -->
  <rect x="38" y="442" width="820" height="104" rx="8" fill="#F4F7FA" stroke="#D5DEE7"/>
  <text x="52" y="464" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#5F6B75">PERSISTENT STATE — SQLite (demo) / PostgreSQL + PostGIS (MVP)</text>
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#1B1B1B">
    <rect x="54" y="478" width="112" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="64" y="506">image</text>
    <rect x="178" y="478" width="112" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="188" y="506">detection</text>
    <rect x="302" y="478" width="112" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="312" y="506">judgement</text>
    <rect x="426" y="478" width="112" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="436" y="506">job</text>
    <rect x="550" y="478" width="112" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="560" y="506">audit</text>
    <rect x="674" y="478" width="160" height="46" rx="5" fill="#FFFFFF" stroke="#C9D3DC"/><text x="684" y="506">structure / member</text>
  </g>
  <text x="52" y="536" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">append-only triggers on judgement and audit</text>

  <!-- Context and future -->
  <rect x="38" y="570" width="520" height="100" rx="8" fill="#F6F0E4" stroke="#6B5A3E"/>
  <text x="52" y="592" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6B5A3E">CONTEXT SURFACES (READ-ONLY)</text>
  <text x="52" y="614" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1B1B1B">MapLibre 3D · GSI imagery · OSM corridor</text>
  <text x="52" y="632" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">real-line photos (Commons) · demo flight / plan / analysis</text>
  <text x="52" y="650" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">never writes findings or report rows</text>

  <rect x="580" y="570" width="462" height="100" rx="8" fill="#FFFFFF" stroke="#555" stroke-dasharray="2 3"/>
  <text x="594" y="592" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#555">FUTURE MODULES (RESEARCH)</text>
  <text x="594" y="614" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1B1B1B">geometry-core · drone photogrammetry · point-cloud measurement</text>
  <text x="594" y="632" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">own data contract: alignment, cross-sections, DEM, GCP, uncertainty</text>
  <text x="594" y="650" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">must not bypass judgement / audit</text>

  <!-- Legend -->
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#5F6B75">
    <rect x="38" y="690" width="14" height="10" fill="#EAF2FA" stroke="#24425F"/><text x="58" y="699">runtime</text>
    <rect x="112" y="690" width="14" height="10" fill="#E8F3EA" stroke="#2F6240"/><text x="132" y="699">human / learning</text>
    <rect x="232" y="690" width="14" height="10" fill="#FFFFFF" stroke="#24425F" stroke-dasharray="4 3"/><text x="252" y="699">optional</text>
    <rect x="312" y="690" width="14" height="10" fill="#FFFFFF" stroke="#555" stroke-dasharray="2 3"/><text x="332" y="699">research</text>
    <line x1="398" y1="695" x2="428" y2="695" stroke="#1B1B1B" stroke-width="1.6" marker-end="url(#a)"/><text x="434" y="699">control</text>
    <line x1="492" y1="695" x2="522" y2="695" stroke="#7A8792" stroke-width="1.6" marker-end="url(#g)"/><text x="528" y="699">evidence</text>
    <line x1="590" y1="695" x2="620" y2="695" stroke="#A63A4A" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#r)"/><text x="626" y="699">audit / decision</text>
  </g>
</svg>
